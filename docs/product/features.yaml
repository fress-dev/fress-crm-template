# Salus 由来パーソナルジム機能のバックログ（AI・スクリプト向け）
# 人間向けの一覧・選び方: docs/product/roadmap.md
# 更新ルール: 設計承認・PR マージ・スコープ判断のたびに status / pr / design を更新する
# status: not-started（未着手）| in-progress（着手）| done（完了）| on-hold（保留）

version: 1
last_updated: 2026-06-13
primary_tenant: noexcuse

# 縦切りシナリオ（roadmap.md 参照）
scenarios:
  A: 新規入会（体験予約 → 体験 → 契約 → 初回予約）
  B: 日常セッション（カルテ → 予約確認 → 実施記録 → チケット消費）
  C: マスタ整備（店舗 → コース → スタッフ・権限）

# 05-gap-analysis.md から吸収した判断事項（open → decided に更新していく）
decisions:
  - id: scope-phase1
    question: Salus 全機能を再現するか、Phase 1 は P0 のみか
    status: open
    value: null
  - id: multi-store-from-start
    question: マルチ店舗を最初から必要とするか
    status: decided
    value: true
  - id: payment-future
    question: 決済連携を将来要件として残すか（Salus にも無し）
    status: open
    value: null
  - id: deal-as-pipeline
    question: Deal を入会パイプラインとして使うか（金額は使わない）
    status: decided
    value: true
  - id: companies-hidden
    question: companies を無効化・非表示でよいか
    status: decided
    value: true
  - id: contact-as-member
    question: Contact ＝ 会員で確定するか
    status: decided
    value: true
  - id: plugin-split
    question: P0 を1プラグインにまとめるか、機能単位で分割するか
    status: decided
    value: feature-split # appointments + memberships + session-log 等
  - id: first-plugin-after-stores
    question: 店舗の次に着手する P0（appointments / memberships / 縦切り）
    status: decided
    value: courses-and-appointments-in-review
    notes: plugin-courses（PR #27）と plugin-appointments（PR #26）がレビュー中。マージ後は plugin-memberships が次候補

